<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Garnish Bar & Atelier — El Templo de la Coctelería · Mendoza</title>
<meta name="description" content="Cocktail Bar, Whisky Club & Restaurant en Av. Arístides Villanueva 528, Mendoza. Reservá tu mesa." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0b241c;
    --green:#0e2b22;
    --green-mid:#15382c;
    --green-soft:#1c4636;
    --gold:#c9a557;
    --gold-bright:#e2c277;
    --gold-deep:#9a7f3f;
    --cream:#f3ead8;
    --cream-mute:#d8cdb4;
    --ink:#0a1814;
    --line:rgba(201,165,87,.35);
    --line-soft:rgba(201,165,87,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--green);
    color:var(--cream);
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:18px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 20% 0%,rgba(28,70,54,.6),transparent 60%),
      radial-gradient(ellipse at 80% 100%,rgba(28,70,54,.4),transparent 55%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.78  0 0 0 0 0.65  0 0 0 0 0.34  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events:none;
    z-index:0;
    opacity:.9;
  }
  main, header, footer{position:relative;z-index:1}

  .display{
    font-family:"Cinzel",serif;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold);
    display:inline-flex;
    align-items:center;
    gap:.7em;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    width:24px;height:1px;background:var(--gold);
    opacity:.6;
  }
  .eyebrow.left::after{display:none}
  .eyebrow.right::before{display:none}
  .italic{font-style:italic;color:var(--cream-mute);font-weight:400}
  a{color:inherit;text-decoration:none}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.65em;
    font-family:"Cinzel",serif;
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
    padding:18px 32px;
    border:1px solid var(--gold);
    color:var(--gold);
    background:transparent;
    cursor:pointer;
    transition:all .35s ease;
    position:relative;
    white-space:nowrap;
  }
  .btn:hover{
    background:var(--gold);
    color:var(--green-deep);
  }
  .btn.solid{
    background:var(--gold);
    color:var(--green-deep);
  }
  .btn.solid:hover{
    background:var(--gold-bright);
    border-color:var(--gold-bright);
  }
  .btn svg{width:14px;height:14px}

  nav.top{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 48px;
    transition:background .4s ease,border-color .4s ease;
    border-bottom:1px solid transparent;
  }
  nav.top.scrolled{
    background:rgba(11,36,28,.85);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom-color:var(--line-soft);
  }
  nav.top .seal-mini{width:44px;height:44px}
  nav.top .links{display:flex;gap:36px}
  nav.top .links a{
    font-family:"Cinzel",serif;font-size:12px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--cream-mute);
    transition:color .3s ease;
    position:relative;padding-bottom:4px;
  }
  nav.top .links a:hover{color:var(--gold)}
  nav.top .links a::after{
    content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;
    background:var(--gold);transition:all .3s ease;transform:translateX(-50%);
  }
  nav.top .links a:hover::after{width:100%}
  nav.top .reserve-mini{
    font-family:"Cinzel",serif;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;
    border:1px solid var(--gold);color:var(--gold);
    padding:10px 18px;
    transition:all .3s ease;
  }
  nav.top .reserve-mini:hover{background:var(--gold);color:var(--green-deep)}

  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:120px 32px 80px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero .ornament-top,.hero .ornament-bottom{
    position:absolute;left:50%;transform:translateX(-50%);
    width:min(720px,80vw);height:24px;
    opacity:.55;
  }
  .hero .ornament-top{top:110px}
  .hero .ornament-bottom{bottom:80px}

  .hero .seal-large{width:120px;height:120px;margin-bottom:36px}
  .hero h1{
    font-family:"Cinzel",serif;
    font-weight:500;
    font-size:clamp(48px,8.5vw,128px);
    line-height:.95;
    letter-spacing:.02em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .hero h1 .amp{
    font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;
    text-transform:lowercase;letter-spacing:0;
    color:var(--cream-mute);
    font-size:.65em;vertical-align:.05em;
    padding:0 .1em;
  }
  .hero .tagline{
    font-family:"Cormorant Garamond",serif;
    font-style:italic;font-weight:400;
    font-size:clamp(20px,2.4vw,32px);
    color:var(--cream-mute);
    margin:18px 0 40px;
    letter-spacing:.01em;
  }
  .hero .meta{
    display:flex;align-items:center;gap:22px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--cream-mute);
    margin-bottom:48px;
  }
  .hero .meta span.dot{
    width:4px;height:4px;border-radius:50%;
    background:var(--gold);opacity:.7;
  }
  .hero .cta-row{
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
    position:relative;
    z-index:10;
  }
  .hero .scroll-hint{
    position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.3em;
    color:var(--cream-mute);text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    opacity:.7;
    z-index:1;
  }
  .scroll-hint .line{
    width:1px;height:40px;background:var(--gold);
    animation:scrollPulse 2.4s ease-in-out infinite;
    transform-origin:top;
  }
  @keyframes scrollPulse{
    0%,100%{transform:scaleY(.3);opacity:.4}
    50%{transform:scaleY(1);opacity:1}
  }section{position:relative;padding:140px 48px}
  .container{max-width:1240px;margin:0 auto}
  .section-head{text-align:center;margin-bottom:80px}
  .section-head h2{
    font-family:"Cinzel",serif;font-weight:500;
    font-size:clamp(36px,5vw,68px);
    color:var(--gold);
    text-transform:uppercase;letter-spacing:.04em;
    margin-top:16px;line-height:1.05;
  }
  .section-head .sub{
    font-style:italic;color:var(--cream-mute);
    font-size:clamp(18px,1.6vw,22px);
    margin-top:16px;max-width:640px;margin-left:auto;margin-right:auto;
  }

  .manifesto{
    background:var(--green-deep);
    border-top:1px solid var(--line-soft);
    border-bottom:1px solid var(--line-soft);
  }
  .manifesto .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;
  }
  .manifesto .copy h2{
    font-family:"Cinzel",serif;font-weight:500;
    font-size:clamp(34px,4.4vw,58px);
    color:var(--gold);
    text-transform:uppercase;letter-spacing:.04em;
    line-height:1.05;
    margin:18px 0 28px;
  }
  .manifesto .copy p{
    color:var(--cream);
    font-size:20px;line-height:1.65;
    margin-bottom:18px;
    max-width:520px;
  }
  .manifesto .copy p .accent{color:var(--gold-bright);font-style:italic}
  .manifesto .stats{
    display:flex;gap:36px;margin-top:38px;flex-wrap:wrap;
  }
  .stat{border-left:1px solid var(--gold);padding-left:18px}
  .stat .num{
    font-family:"Cinzel",serif;font-size:36px;color:var(--gold);font-weight:600;
    line-height:1;
  }
  .stat .lbl{
    font-family:"JetBrains Mono",monospace;font-size:10px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--cream-mute);
    margin-top:8px;display:block;
  }

  .img-frame{
    position:relative;
    aspect-ratio:4/5;
    border:1px solid var(--gold);
    padding:14px;
    background:var(--green-mid);
  }
  .img-frame::before{
    content:"";position:absolute;inset:6px;border:1px solid var(--line-soft);pointer-events:none;
  }
  .img-frame .corner{position:absolute;width:18px;height:18px;border:1px solid var(--gold)}
  .img-frame .corner.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .img-frame .corner.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}
  .img-frame .corner.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}
  .img-frame .corner.br{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .img-frame .inner{
    width:100%;height:100%;
    background:
      repeating-linear-gradient(135deg,
        rgba(201,165,87,.06) 0 2px,
        transparent 2px 14px),
      linear-gradient(180deg,var(--green-soft),var(--green-mid));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;color:var(--cream-mute);
  }
  .img-frame .inner .ph-label{
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;opacity:.75;
  }
  .img-frame .inner .ph-icon{font-family:"Cinzel",serif;font-size:34px;color:var(--gold);opacity:.6}
  .img-frame .real-photo{
    position:absolute;inset:14px;
    width:calc(100% - 28px);height:calc(100% - 28px);
    object-fit:cover;
    z-index:2;
  }

  .pillars{background:var(--green)}
  .pillars-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
  .pillar{
    border:1px solid var(--line);
    padding:48px 36px;
    background:var(--green-mid);
    position:relative;
    transition:all .4s ease;
  }
  .pillar::before{
    content:"";position:absolute;top:14px;left:14px;right:14px;bottom:14px;
    border:1px solid var(--line-soft);pointer-events:none;
    transition:border-color .4s ease;
  }
  .pillar:hover{transform:translateY(-4px);background:var(--green-soft)}
  .pillar:hover::before{border-color:var(--gold)}
  .pillar .num{
    font-family:"Cinzel",serif;font-size:14px;color:var(--gold-deep);
    letter-spacing:.4em;margin-bottom:24px;display:block;
  }
  .pillar h3{
    font-family:"Cinzel",serif;font-size:28px;color:var(--gold);
    font-weight:500;letter-spacing:.04em;text-transform:uppercase;
    margin-bottom:18px;line-height:1.1;
  }
  .pillar p{color:var(--cream-mute);font-size:17px;line-height:1.6}
  .pillar .glyph{
    width:48px;height:48px;margin-bottom:28px;color:var(--gold);
  }

  .whisky{
    background:var(--green-deep);
    border-top:1px solid var(--line-soft);
    border-bottom:1px solid var(--line-soft);
    overflow:hidden;
  }
  .whisky .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:center}
  .whisky .copy h2{
    font-family:"Cinzel",serif;font-weight:500;
    font-size:clamp(34px,4.4vw,58px);
    color:var(--gold);text-transform:uppercase;letter-spacing:.04em;
    line-height:1.05;margin:18px 0 28px;
  }
  .whisky .copy p{color:var(--cream);font-size:19px;margin-bottom:14px;max-width:480px}
  .whisky .regions{
    display:grid;grid-template-columns:1fr 1fr;gap:14px 36px;
    margin-top:32px;max-width:480px;
  }
  .whisky .regions .row{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px dashed var(--line-soft);padding:10px 0;
    font-family:"Cinzel",serif;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--cream);
  }
  .whisky .regions .row .qty{color:var(--gold);font-weight:500}

  .bottle-wall{
    aspect-ratio:1/1;
    border:1px solid var(--gold);
    padding:14px;
    background:var(--green-mid);
    position:relative;
  }
  .bottle-wall::before{
    content:"";position:absolute;inset:6px;border:1px solid var(--line-soft);
  }
  .bottle-wall .shelves{
    width:100%;height:100%;
    display:grid;grid-template-rows:repeat(5,1fr);
    gap:0;
    background:linear-gradient(180deg,#1c4636,#0e2b22);
    padding:14px 18px;
  }
  .bottle-wall .shelf{
    display:flex;align-items:flex-end;gap:8px;
    border-bottom:2px solid var(--gold-deep);
    padding-bottom:0;
  }
  .bottle-wall .shelf:last-child{border-bottom:none}
  .bottle{
    flex:1;
    height:78%;
    background:linear-gradient(180deg,rgba(201,165,87,.12),rgba(201,165,87,.32));
    border-radius:2px 2px 1px 1px;
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(201,165,87,.25);
  }
  .bottle::before{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:32%;height:10px;
    background:rgba(201,165,87,.25);
    border-radius:1px;
  }
  .bottle::after{
    content:"";position:absolute;top:24%;left:14%;right:14%;height:18%;
    background:rgba(243,234,216,.12);
    border:1px solid rgba(201,165,87,.18);
  }
  .bottle.tall{height:88%}
  .bottle.short{height:64%}
  .bottle.amber{background:linear-gradient(180deg,rgba(201,128,40,.25),rgba(154,80,30,.55))}
  .bottle.dark{background:linear-gradient(180deg,rgba(80,40,20,.5),rgba(36,18,8,.85))}
  .bottle.pale{background:linear-gradient(180deg,rgba(220,200,140,.2),rgba(180,150,80,.5))}

  .reviews{
    background:var(--green);
    text-align:center;
  }
  .reviews .stars{
    display:flex;justify-content:center;gap:8px;margin-bottom:18px;color:var(--gold);
    font-size:24px;letter-spacing:.1em;
  }
  .reviews .pull-quote{
    font-family:"Cormorant Garamond",serif;font-style:italic;
    font-size:clamp(24px,2.6vw,34px);
    line-height:1.35;
    max-width:880px;margin:0 auto 18px;color:var(--cream);
    position:relative;padding:0 60px;
  }
  .reviews .pull-quote::before,.reviews .pull-quote::after{
    font-family:"Cinzel",serif;color:var(--gold);font-size:72px;
    line-height:1;position:absolute;font-style:normal;opacity:.55;
  }
  .reviews .pull-quote::before{content:""";left:0;top:-10px}
  .reviews .pull-quote::after{content:""";right:0;bottom:-30px}
  .reviews .attribution{
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--cream-mute);margin-bottom:60px;
  }
  .review-cards{
    display:grid;grid-template-columns:1fr 1fr;gap:24px;
    max-width:980px;margin:0 auto;
  }
  .review-card{
    border:1px solid var(--line);
    padding:36px 32px;
    background:var(--green-mid);
    text-align:left;
    display:flex;flex-direction:column;gap:16px;
    transition:all .35s ease;
    position:relative;
  }
  .review-card::before{
    content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;
    border:1px solid var(--line-soft);pointer-events:none;
    transition:border-color .35s ease;
  }
  .review-card:hover{background:var(--green-soft);transform:translateY(-3px)}
  .review-card:hover::before{border-color:var(--gold)}
  .review-card .head{
    display:flex;align-items:center;gap:14px;
  }
  .review-card .logo{
    width:44px;height:44px;
    border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:"Cinzel",serif;font-weight:700;color:var(--gold);font-size:18px;
  }
  .review-card .source{
    font-family:"Cinzel",serif;font-size:13px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);
  }
  .review-card .rating{
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;
    color:var(--cream-mute);margin-top:2px;
  }
  .review-card .stim{
    font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;
    color:var(--cream);line-height:1.5;
  }
  .review-card .act{
    margin-top:auto;
    display:inline-flex;align-items:center;gap:8px;
    font-family:"Cinzel",serif;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);
    padding-top:8px;
    border-top:1px solid var(--line-soft);
  }
  .review-card .act svg{width:12px;height:12px;transition:transform .3s ease}
  .review-card:hover .act svg{transform:translateX(4px)}

  .visit{background:var(--green-deep)}
  .visit .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:stretch;
  }
  .visit .info{padding-right:24px}
  .visit h2{
    font-family:"Cinzel",serif;font-weight:500;
    font-size:clamp(34px,4.4vw,58px);
    color:var(--gold);text-transform:uppercase;letter-spacing:.04em;
    line-height:1.05;margin:18px 0 32px;
  }
  .visit .address-block{
    border-left:1px solid var(--gold);padding-left:24px;margin-bottom:36px;
  }
  .visit .address-block .label{
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);
  }
  .visit .address-block .value{
    font-family:"Cinzel",serif;font-size:24px;color:var(--cream);
    text-transform:uppercase;letter-spacing:.04em;margin-top:8px;
    line-height:1.3;
  }
  .visit .address-block .value .small{
    display:block;font-family:"Cormorant Garamond",serif;font-style:italic;
    font-size:18px;color:var(--cream-mute);text-transform:none;letter-spacing:0;
    margin-top:4px;
  }
  .hours{
    border:1px solid var(--line);
    padding:28px 32px;
    margin-bottom:36px;
    background:var(--green-mid);
    position:relative;
  }
  .hours::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--line-soft);pointer-events:none;
  }
  .hours h4{
    font-family:"Cinzel",serif;font-size:14px;letter-spacing:.26em;
    color:var(--gold);text-transform:uppercase;margin-bottom:18px;
    display:flex;align-items:center;gap:10px;
  }
  .hours h4::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .hours .row{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px dashed var(--line-soft);
    font-size:17px;
  }
  .hours .row:last-child{border-bottom:none}
  .hours .row .day{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-mute)}
  .hours .row .time{color:var(--gold);font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.1em}

  .visit .contacts{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
  .visit .contact-pill{
    display:inline-flex;align-items:center;gap:10px;
    border:1px solid var(--line);padding:14px 22px;
    font-family:"Cinzel",serif;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--cream);
    transition:all .3s ease;
  }
  .visit .contact-pill:hover{border-color:var(--gold);color:var(--gold)}
  .visit .contact-pill svg{width:14px;height:14px;color:var(--gold)}

  .map-frame{
    position:relative;
    border:1px solid var(--gold);
    padding:14px;
    background:var(--green-mid);
    min-height:560px;
    display:flex;flex-direction:column;
  }
  .map-frame::before{
    content:"";position:absolute;inset:6px;border:1px solid var(--line-soft);pointer-events:none;
  }
  .map-inner{
    flex:1;
    background:linear-gradient(180deg,#0a2018,#0e2b22);
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
